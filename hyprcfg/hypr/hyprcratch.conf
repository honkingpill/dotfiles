# ~/.config/hypr/hyprscratch.conf
   terminal {
   command = kitty --class scratchpad_term
   class = scratchpad_term
   options = lazy shiny
}
   notes {
   command = obsidian --class scratch_notes
   class = scratch_notes
   options = shiny sticky
}
   chat {
   command = Telegram --class scratch_chat
   class = scratch_chat
   options = lazy
}
