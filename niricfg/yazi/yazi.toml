[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
tab_size      = 2
max_width     = 1200
max_height    = 1800
image_quality = 80

[opener]
edit = [
  { run = 'vim %s',   desc = "vim",   block = true },
  { run = 'micro %s', desc = "micro", block = true },
  { run = 'nano %s',  desc = "nano",  block = true },
]
open = [
  { run = 'xdg-open %s', desc = "xdg-open" },
]
media = [
  { run = 'ffplay "$1"', desc = "ffplay", orphan = true },
]
image = [
  # gimp не установлен на момент правки — команда прописана заранее,
  # заработает как только появится пакет.
  { run = 'gimp %s', desc = "GIMP", orphan = true },
]
video = [
  { run = 'vlc %s', desc = "VLC", orphan = true },
]
word = [
 { run = '/home/$USER/Applications/wordcraft*.AppImage %s', desc = "WordCraft", orphan = true},

  #{ run = 'echo "0=[$0] 1=[$1] all=[$@]" > /tmp/yazi-args.txt', desc = "debug", orphan = true },
]
sheets = [
 { run = '/home/$USER/Applications/gridcraft*.AppImage %s', desc = "GridCraft", orphan = true},
]
pdf = [
 { run = '/home/$USER/Applications/pdfcraft*.AppImage %s', desc = "pdfCraft", orphan = true},
]
photoshop = [
 { run = '/home/$USER/Applications/photocraft*.AppImage %s', desc = "PhotoCraft", orphan = true},
]
design = [
 { run = '/home/$USER/Applications/designcraft*.AppImage %s', desc = "DesignCraft", orphan = true},
]
deck = [
 { run = '/home/$USER/Applications/deckcraft*.AppImage %s', desc = "DeckCraft", orphan = true},
]

[open]
rules = [
  # текст
  { mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.*", use = ["word", "open"] },
  { mime = "application/msword",                      use = ["word", "open"] },
  { mime = "application/vnd.oasis.opendocument.text", use = ["word", "open"] },
  { mime = "application/rtf",                         use = ["word", "open"] },
  { mime = "application/vnd.openxmlformats-officedocument.wordprocessingml.document",                         use = ["word", "open"] },
  { url = "*.docx" , use = ["word", "open"] },
  # таблицы
  { mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.*", use = ["sheets", "open"] },
  { mime = "application/vnd.ms-excel",                       use = ["sheets", "open"] },
  { mime = "application/vnd.oasis.opendocument.spreadsheet", use = ["sheets", "open"] },
  { url = "*.xlsx", use = ["sheets", "open"] },

  # pdf
  { mime = "application/pdf", use = ["pdf", "open"] },

  # графика
  { mime = "image/vnd.adobe.photoshop", use = ["photoshop", "open"] },
  { mime = "image/svg+xml",             use = ["design", "edit", "open"] },
  { mime = "image/*",                   use = ["open", "photoshop", "design"] },

  # презентации
  { url = "*.pptx",                     use = ["deck", "open"] },
  { mime = "application/vnd.openxmlformats-officedocument.presentationml.presentation.*", use = ["deck", "open"] },


  # ...остальные твои правила (text/*, video/*, audio/*, и т.д.)
  { mime = "*", use = ["open", "edit"] },

  { mime = "text/*",           use = ["edit", "open"] },
  { mime = "application/json", use = ["edit", "open"] },
  { mime = "application/xml",  use = ["edit"] },
  { mime = "image/*",          use = ["open", "image"] },
  { mime = "video/*",          use = ["video", "media", "open"] },
  { mime = "audio/*",          use = ["media", "open"] },
  { mime = "application/pdf",  use = ["office", "open"] },

  { mime = "*",                use = ["open", "edit"] },
]

[plugin]
#prepend_fetchers = [
#  { url = "*",  run = "git", group = "git" },
#  { url = "*/", run = "git", group = "git" },
#]

[tasks]
file_workers    = 5
plugin_workers  = 5
fetch_workers   = 5
preload_workers = 3
process_workers = 3
bizarre_retry   = 5
image_alloc     = 536870912
image_bound     = [0, 0]
suppress_preload = false

[log]
enabled = false
